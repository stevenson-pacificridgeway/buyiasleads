<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 880" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="The Annuity Lead ROI Funnel: 100 exclusive FIA leads become about 40 conversations, 12 appointments, 3 closed cases, and roughly $9,000 in commission.">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2770"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="760" height="880" fill="#ffffff"/>

  <!-- Header -->
  <rect x="0" y="0" width="760" height="138" fill="url(#hdr)"/>
  <rect x="0" y="138" width="760" height="5" fill="#2dd496"/>
  <!-- logo mark -->
  <polyline points="36,46 52,30 66,42 88,20" fill="none" stroke="#2dd496" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="88" cy="20" r="3.5" fill="#2dd496"/>
  <text x="100" y="40" fill="#ffffff" font-size="19" font-weight="700" letter-spacing="1.5">BUYIASLEADS</text>
  <text x="380" y="92" fill="#ffffff" font-size="30" font-weight="800" text-anchor="middle">The Annuity Lead ROI Funnel</text>
  <text x="380" y="118" fill="#cdd0ea" font-size="15" text-anchor="middle">What 100 exclusive FIA leads can turn into</text>

  <!-- Funnel stages -->
  <!-- S1 -->
  <rect x="80" y="178" width="600" height="78" rx="12" fill="#4f46e5"/>
  <text x="108" y="214" fill="#ffffff" font-size="17" font-weight="600">Exclusive FIA leads purchased</text>
  <text x="108" y="238" fill="#c7c4f5" font-size="13">Introduced under your name, nurtured all year</text>
  <text x="652" y="228" fill="#ffffff" font-size="34" font-weight="800" text-anchor="end">100</text>

  <!-- arrow + rate -->
  <text x="380" y="276" fill="#4b5563" font-size="12" text-anchor="middle">40% contact rate &#8595;</text>

  <!-- S2 -->
  <rect x="140" y="286" width="480" height="78" rx="12" fill="#4659e0"/>
  <text x="168" y="322" fill="#ffffff" font-size="17" font-weight="600">Conversations (you reach them)</text>
  <text x="168" y="346" fill="#cdd2f7" font-size="13">No race &#8212; they expect your call</text>
  <text x="592" y="336" fill="#ffffff" font-size="34" font-weight="800" text-anchor="end">40</text>

  <text x="380" y="384" fill="#4b5563" font-size="12" text-anchor="middle">30% set an appointment &#8595;</text>

  <!-- S3 -->
  <rect x="200" y="394" width="360" height="78" rx="12" fill="#2f8fc0"/>
  <text x="228" y="430" fill="#ffffff" font-size="17" font-weight="600">Appointments booked</text>
  <text x="228" y="454" fill="#d6ecf6" font-size="13">Qualified, sit-down conversations</text>
  <text x="532" y="444" fill="#ffffff" font-size="34" font-weight="800" text-anchor="end">12</text>

  <text x="380" y="492" fill="#4b5563" font-size="12" text-anchor="middle">25% close &#8595;</text>

  <!-- S4 -->
  <rect x="255" y="502" width="250" height="78" rx="12" fill="#1fae8f"/>
  <text x="283" y="538" fill="#ffffff" font-size="17" font-weight="600">Closed cases</text>
  <text x="283" y="562" fill="#d4f5ec" font-size="13">Annuity applications written</text>
  <text x="477" y="552" fill="#ffffff" font-size="34" font-weight="800" text-anchor="end">3</text>

  <!-- Result -->
  <rect x="170" y="612" width="420" height="96" rx="14" fill="#17b877"/>
  <text x="380" y="648" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">GROSS COMMISSION  (~$3,000 avg / case)</text>
  <text x="380" y="690" fill="#ffffff" font-size="40" font-weight="800" text-anchor="middle">~ $9,000</text>

  <!-- Results strip -->
  <g font-size="14">
    <text x="130" y="762" fill="#4b5563" text-anchor="middle">Investment</text>
    <text x="130" y="786" fill="#17163a" font-size="20" font-weight="800" text-anchor="middle">$2,100</text>
    <line x1="253" y1="748" x2="253" y2="792" stroke="#e6e8ec" stroke-width="1.5"/>
    <text x="380" y="762" fill="#4b5563" text-anchor="middle">Net profit</text>
    <text x="380" y="786" fill="#17b877" font-size="20" font-weight="800" text-anchor="middle">~ $6,900</text>
    <line x1="507" y1="748" x2="507" y2="792" stroke="#e6e8ec" stroke-width="1.5"/>
    <text x="630" y="762" fill="#4b5563" text-anchor="middle">Return</text>
    <text x="630" y="786" fill="#4f46e5" font-size="20" font-weight="800" text-anchor="middle">~ 4.3&#215;</text>
  </g>

  <text x="380" y="838" fill="#9aa0be" font-size="12" text-anchor="middle">Illustrative example &#8212; results vary and are not typical.  buyiasleads.com</text>
</svg>
